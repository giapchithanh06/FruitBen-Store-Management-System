<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="author" content="Giáp Chí Thanh" />
    <title>Sản phẩm - Quản trị FruitBen</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/all.min.css" />
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="ad-body" data-goc="../" data-menu="san-pham">
    <!-- Thanh bên + thanh trên được chèn bởi assets/js/admin.js -->
    <div id="adNoiDung">
        <div class="ad-head">
            <div>
                <a href="san-pham.html" class="text-muted" style="font-size: .88rem;"><i class="fas fa-arrow-left"></i> Danh sách sản phẩm</a>
                <h1 id="tieuDeForm"></h1>
                <p id="moTaForm"></p>
            </div>
            <a class="fb-btn fb-btn-soft" id="xemTrenCuaHang" href="#" target="_blank"><i class="fas fa-external-link-alt"></i> Xem trên cửa hàng</a>
        </div>
        <form id="formSanPham" novalidate>
            <div class="ad-form-grid">
                <div class="ad-panel">
                    <div class="form-row">
                        <div class="col-md-7 fb-field">
                            <label for="ten">Tên sản phẩm <span class="req">*</span></label>
                            <input class="fb-control" id="ten" name="ten" placeholder="VD: Táo Envy New Zealand" data-bat-buoc="Vui lòng nhập tên sản phẩm" data-nhieu-nhat="150" />
                            <span class="fb-error" data-loi-cho="ten"></span>
                        </div>
                        <div class="col-md-5 fb-field">
                            <label for="loai">Loại <span class="req">*</span></label>
                            <select class="fb-control" id="loai" name="loai" data-bat-buoc="Vui lòng chọn loại"></select>
                            <span class="fb-error" data-loi-cho="loai"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 fb-field">
                            <label for="gia">Giá bán / kg (đ) <span class="req">*</span></label>
                            <input class="fb-control" id="gia" name="gia" type="number" step="1000" min="1000" placeholder="85000" data-bat-buoc="Vui lòng nhập giá bán" data-so-tu="1000" data-so-loi="Giá bán tối thiểu 1.000đ" />
                            <span class="fb-error" data-loi-cho="gia"></span>
                        </div>
                        <div class="col-md-4 fb-field">
                            <label for="giaCu">Giá cũ / kg (đ)</label>
                            <input class="fb-control" id="giaCu" name="giaCu" type="number" step="1000" min="0" placeholder="Để trống nếu không giảm" />
                            <span class="fb-error" data-loi-cho="giaCu"></span>
                        </div>
                        <div class="col-md-4 fb-field">
                            <label for="ton">Tồn kho (kg) <span class="req">*</span></label>
                            <input class="fb-control" id="ton" name="ton" type="number" step="1" min="0" data-bat-buoc="Vui lòng nhập tồn kho" data-so-tu="0" data-so-loi="Tồn kho không được âm" />
                            <span class="fb-error" data-loi-cho="ton"></span>
                        </div>
                    </div>
                    <div class="fb-note-box mb-3" id="xemGiam" hidden><i class="fas fa-fire" style="color: var(--fb-red);"></i> Sản phẩm sẽ hiện nhãn <b>Sale</b> và giảm <b id="phanTramGiam"></b>.</div>
                    <div class="fb-field">
                        <label for="moTa">Mô tả</label>
                        <textarea class="fb-control" id="moTa" name="moTa" rows="5" placeholder="Nguồn gốc, hương vị, cách dùng..." data-nhieu-nhat="1000"></textarea>
                        <span class="fb-error" data-loi-cho="moTa"></span>
                    </div>
                    <label class="ad-switch" for="conHang"><input type="checkbox" id="conHang" name="conHang" /> Đang mở bán trên website</label>
                </div>
                <div class="ad-panel">
                    <label class="font-weight-bold">Ảnh chính <span class="req">*</span></label>
                    <div class="ad-preview"><img id="anhXemTruoc" src="" alt="Ảnh sản phẩm" hidden /><i class="far fa-image" id="iconTrong"></i></div>
                    <div class="fb-field mt-3">
                        <input type="file" name="fileAnh" accept="image/*" class="form-control-file" />
                        <small class="text-muted d-block mt-1">Ảnh được thu nhỏ và lưu ngay trong trình duyệt.</small>
                        <label for="tenFileAnh" class="mt-2" style="font-size: .82rem;">Hoặc tên file có sẵn trong <code>assets/img/products/</code></label>
                        <input class="fb-control" id="tenFileAnh" name="tenFileAnh" style="height: 40px;" placeholder="vd: dau-tay.jpg" />
                    </div>
                    <label class="font-weight-bold">Ảnh phụ <small class="text-muted">(thư viện ảnh ở trang chi tiết)</small></label>
                    <div class="ad-thumbs mb-2" id="dsAnhPhu"></div>
                    <input type="file" name="fileAnhPhu" multiple accept="image/*" class="form-control-file" />
                    <small class="text-muted d-block mt-1">Chọn nhiều ảnh cùng lúc (tối đa 6 ảnh/lần).</small>
                </div>
            </div>
            <div class="ad-form-actions">
                <a class="fb-btn fb-btn-outline" href="san-pham.html">Huỷ bỏ</a>
                <button type="submit" class="fb-btn fb-btn-grad"><i class="fas fa-save"></i> Lưu sản phẩm</button>
            </div>
        </form>
    </div>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/du-lieu-mau.js"></script>
    <script src="../assets/js/kho-du-lieu.js"></script>
    <script src="../assets/js/nghiep-vu.js"></script>
    <script src="../assets/js/giao-dien.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/admin/san-pham.js"></script>
</body>
</html>
